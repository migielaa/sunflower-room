server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Send the root to the app's base path.
    location = / {
        return 302 /sunflower-room/;
    }

    # Fingerprinted assets are immutable — cache them aggressively.
    location /sunflower-room/_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App shell (single web output): fall back to index.html.
    location /sunflower-room/ {
        try_files $uri $uri/ /sunflower-room/index.html;
    }
}
